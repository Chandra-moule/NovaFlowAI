<body>

    <header>
        <div class="logo">NovaFlow AI</div>

        <nav>

    <section class="page-banner">
        <h1>Contact Us</h1>
    </section>

    <section class="contact-section">

        <form class="contact-form" id="contactForm">

    <input
    type="text"
    id="name"
    placeholder="Your Name">

    <input
    type="email"
    id="email"
    placeholder="Your Email">

    <textarea
    rows="5"
    id="message"
    placeholder="Message"></textarea>

    <p id="formMessage"></p>

    <button
    type="submit"
    class="primary-btn">

        Send Message

    </button>

</form>

    </section>
    <script src="startup-website\js\script.js"></script>

<iframe
